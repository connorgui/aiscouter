services:
  - type: web
    name: ai-scouter
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-scouter-db
          property: connectionString
databases:
  - name: ai-scouter-db
    plan: free
